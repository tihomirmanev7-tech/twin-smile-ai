</style></head><body><div class="app"><h2>TWIN SMILE <span style="color:#87d4ff">AI</span></h2><small>Live Smile Studio Â· v0.5 Â· Natural Smile</small><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas></div><div class="controls"><div class="row"><button id="start">ÐÐºÐ»ÑÑÐ¸ ÐºÐ°Ð¼ÐµÑÐ°ÑÐ°</button><button id="photo">Ð¡Ð½Ð¸Ð¼ÐºÐ°</button></div><button id="auto">Auto Design: ÐÐÐ.</button><label>Ð¤Ð¾ÑÐ¼Ð°<select id="design"><option value="natural">Natural Â· Ð°Ð²ÑÐ¾Ð¼Ð°ÑÐ¸ÑÐ½Ð°</option><option value="oval">Soft Oval</option><option value="square">Soft Square</option><option value="taper">Gentle Taper</option></select></label><label>Ð ÐµÐ¶Ð¸Ð¼<select id="mode"><option value="replace">ÐÐ°Ð¼ÑÐ½Ð°</option><option value="compare">Ð¡ÑÐ°Ð²Ð½ÐµÐ½Ð¸Ðµ</option></select></label><label>ÐÑÐ¾Ð·ÑÐ°ÑÐ½Ð¾ÑÑ Ð½Ð° Ð²Ð¸ÑÑÑÐ°Ð»Ð½Ð¸ÑÐµ Ð·ÑÐ±Ð¸: <span id="alphaValue">100%</span><input id="alpha" type="range" min="0" max="100" value="100"></label><label>Ð¦Ð²ÑÑ<select id="shade"><option value="a1">Natural A1</option><option value="b1">Bright B1</option><option value="bl">Bleach</option></select></label><label>Ð Ð°Ð·Ð¼ÐµÑ<input id="size" type="range" min="75" max="125" value="100"></label><label><span><input type="checkbox" id="guide"> ÐÐ¾Ð½ÑÑÑ Ð½Ð° ÑÑÑÐ°ÑÐ°</span></label><div id="status" class="status">ÐÐ¾ÑÐ¾Ð² Ð·Ð° ÑÑÐ°ÑÑÐ¸ÑÐ°Ð½Ðµ.</div></div></div>
<script type="module">
const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d'),stage=$('stage'),status=$('status');

async function loadAI(){status.textContent='ÐÐ°ÑÐµÐ¶Ð´Ð°Ð½Ðµ Ð½Ð° MediaPipe...';const lib=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs');const FaceLandmarker=lib.FaceLandmarker||lib.default?.FaceLandmarker,FilesetResolver=lib.FilesetResolver||lib.default?.FilesetResolver;if(!FaceLandmarker||!FilesetResolver)throw Error('MediaPipe Ð½Ðµ ÑÐµ Ð·Ð°ÑÐµÐ´Ð¸');const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1};try{return await FaceLandmarker.createFromOptions(files,opts)}catch(e){status.textContent='ÐÐ¿Ð¸Ñ Ñ CPU...';opts.baseOptions.delegate='CPU';return await FaceLandmarker.createFromOptions(files,opts)}}
$('start').onclick=async()=>{$('start').disabled=true;try{status.textContent='ÐÐºÐ»ÑÑÐ²Ð°Ð½Ðµ Ð½Ð° ÐºÐ°Ð¼ÐµÑÐ°ÑÐ°...';if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});v.srcObject=stream;await v.play()}if(!detector)detector=await loadAI();status.textContent='AI Ðµ Ð°ÐºÑÐ¸Ð²ÐµÐ½ Â· Natural Smile'}catch(e){status.textContent='ÐÑÐµÑÐºÐ°: '+(e.message||String(e))}finally{$('start').disabled=false}};
function resize(){const d=devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;const cw=Math.round(W*d),ch=Math.round(H*d);if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch}ctx.setTransform(d,0,0,d,0,0)}
const upper=[61,78,191,80,81,82,13,312,311,310,415,308,291],lower=[291,324,318,402,317,14,87,178,88,95,78,61];
function mouthPath(p){ctx.beginPath();let q=p(upper[0]);ctx.moveTo(q.x,q.y);for(let i=1;i<upper.length;i++){q=p(upper[i]);ctx.lineTo(q.x,q.y)}for(let i=1;i<lower.length;i++){q=p(lower[i]);ctx.lineTo(q.x,q.y)}ctx.closePath()}
function faceShape(p){const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const jaw=d(p(172),p(397)),cheeks=d(p(234),p(454)),height=d(p(10),p(152));const ratio=height/Math.max(cheeks,1),jawRatio=jaw/Math.max(cheeks,1);if(ratio>1.55)return 'taper';if(jawRatio>.83)return 'square';return 'oval'}
function toothPath(x,y,w,h,shape,canine){const round=shape==='square'?.10:shape==='taper'?.20:.26;const r=w*round,neck=shape==='taper'?.72:.83;ctx.beginPath();ctx.moveTo(x+w*(1-neck)/2,y);ctx.bezierCurveTo(x+w*.08,y+h*.12,x-w*.015,y+h*.48,x,y+h-r);if(canine){ctx.quadraticCurveTo(x+w*.17,y+h*.94,x+w*.49,y+h*.99);ctx.quadraticCurveTo(x+w*.78,y+h*.92,x+w,y+h-r)}else{ctx.quadraticCurveTo(x,y+h,x+r,y+h);ctx.lineTo(x+w-r,y+h);ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-r)}ctx.bezierCurveTo(x+w*1.01,y+h*.45,x+w*.92,y+h*.13,x+w*(1+neck)/2,y);ctx.closePath()}
function render(p){const l=p(61),r=p(291),t=p(13),b=p(14),width=Math.hypot(r.x-l.x,r.y-l.y),gap=Math.hypot(b.x-t.x,b.y-t.y);if(width<25||gap<width*.07)return;const alpha=Number($('alpha').value)/100;if(alpha<=0)return;const mode=$('mode').value;const shape=auto?faceType:($('design').value==='natural'?'oval':$('design').value);ctx.save();mouthPath(p);ctx.clip();ctx.globalAlpha=alpha;
if(mode==='replace'){const bg=ctx.createRadialGradient((l.x+r.x)/2,(t.y+b.y)/2,width*.05,(l.x+r.x)/2,(t.y+b.y)/2,width*.72);bg.addColorStop(0,'#2b111a');bg.addColorStop(1,'#10070e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H)}
const angle=Math.atan2(r.y-l.y,r.x-l.x),size=Number($('size').value)/100;ctx.translate((l.x+r.x)/2,t.y-gap*.28);ctx.rotate(angle);const span=width*.91*size,units=[.52,.62,.77,.91,1.13,1.13,.91,.77,.62,.52],sum=units.reduce((a,b)=>a+b,0),u=span/sum;let x=-span/2;const shade=$('shade').value,base=shade==='bl'?'#fffdfa':shade==='b1'?'#faf6eb':'#efe4d1',edge=shade==='a1'?'#b3a38b':'#c9c3b7';for(let i=0;i<10;i++){const dist=Math.abs(i-4.5),w=units[i]*u,central=dist<1,lateral=dist>=1&&dist<2,canine=dist>=2&&dist<3;const h=Math.min(width*.29,gap*1.70)*(central?1:lateral?.83:canine?.93:.72)*size;const arch=dist*dist*gap*.026;const yy=arch-gap*.10+(i%2===0?gap*.008:0);const g=ctx.createLinearGradient(x,yy,x+w,yy);g.addColorStop(0,edge);g.addColorStop(.19,base);g.addColorStop(.66,base);g.addColorStop(1,edge);toothPath(x+u*.025,yy,w-u*.05,h,shape,canine);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(70,61,58,.35)';ctx.lineWidth=Math.max(.35,width*.0025);ctx.stroke();ctx.save();ctx.clip();const shine=ctx.createLinearGradient(x,yy,x+w,yy);shine.addColorStop(0,'rgba(255,255,255,0)');shine.addColorStop(.35,'rgba(255,255,255,.17)');shine.addColorStop(.7,'rgba(255,255,255,.03)');shine.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=shine;ctx.fillRect(x,yy,w,h);ctx.restore();x+=w}ctx.restore();if($('guide').checked){ctx.save();mouthPath(p);ctx.strokeStyle='#40ebc9';ctx.lineWidth=2;ctx.stroke();ctx.restore()}}
function draw(){resize();ctx.clearRect(0,0,W,H);if(detector&&v.readyState>=2&&v.videoWidth){try{const now=performance.now();if(v.currentTime!==last&&now-lastDetect>65){last=v.currentTime;lastDetect=now;marks=detector.detectForVideo(v,now).faceLandmarks[0]||null}if(marks){const s=Math.max(W/v.videoWidth,H/v.videoHeight),ox=(W-v.videoWidth*s)/2,oy=(H-v.videoHeight*s)/2,p=id=>({x:marks[id].x*v.videoWidth*s+ox,y:marks[id].y*v.videoHeight*s+oy});faceType=faceShape(p);render(p)}}catch(e){status.textContent='Tracking: '+e.message}}requestAnimationFrame(draw)}draw();
$('photo').onclick=()=>{if(!stream||!v.videoWidth)return;const out=document.createElement('canvas');out.width=c.width;out.height=c.height;const x=out.getContext('2d'),w=out.width,h=out.height,s=Math.max(w/v.videoWidth,h/v.videoHeight);x.save();x.translate(w,0);x.scale(-1,1);x.drawImage(v,(w-v.videoWidth*s)/2,(h-v.videoHeight*s)/2,v.videoWidth*s,v.videoHeight*s);x.drawImage(c,0,0,w,h);x.restore();out.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='twin-smile-v05.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)},'image/png')};
