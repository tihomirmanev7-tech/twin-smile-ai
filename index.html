<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TWIN SMILE AI v0.4</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101522;color:#fff;font:16px -apple-system,Arial}.app{max-width:600px;margin:auto;padding:16px}h2{margin:5px 0}small,.status{color:#afbdd0}.stage{position:relative;aspect-ratio:3/4;background:#202838;border-radius:22px;overflow:hidden;margin:18px 0}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{pointer-events:none}.controls{display:grid;gap:15px}.row{display:flex;gap:10px}button,select{padding:14px;border:0;border-radius:12px;font:inherit}button{background:#dceeff;color:#152238;font-weight:700;flex:1}button:disabled{opacity:.6}select{background:#29364d;color:white;width:100%}label{display:grid;gap:8px}input[type=range]{width:100%}.status{font-size:13px;line-height:1.5;min-height:25px}</style></head>
<body><div class="app"><h2>TWIN SMILE <span style="color:#87d4ff">AI</span></h2><small>Live Smile Studio · v0.4 · Replace test</small><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas></div><div class="controls"><div class="row"><button id="start">Включи камерата</button><button id="photo">Снимка</button></div><label>Дизайн<select id="design"><option value="oval">Natural Oval</option><option value="square">Hollywood Square</option><option value="soft">Soft Rounded</option><option value="taper">Elegant Tapered</option><option value="broad">Broad Smile</option></select></label><label>Цвят<select id="shade"><option value="a1">Natural A1</option><option value="b1">Bright B1</option><option value="bl">Bleach White</option></select></label><label>Размер<input id="size" type="range" min="70" max="130" value="100"></label><label><span><input type="checkbox" id="guide"> Контур на устата</span></label><div id="status" class="status">Готов за стартиране.</div></div></div>
<script type="module">
const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d'),stage=$('stage'),status=$('status');let detector=null,stream=null,marks=null,last=-1,lastDetect=0,cssW=0,cssH=0;
async function loadAI(){status.textContent='Зареждане на MediaPipe...';const lib=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs');const FaceLandmarker=lib.FaceLandmarker||lib.default?.FaceLandmarker,FilesetResolver=lib.FilesetResolver||lib.default?.FilesetResolver;if(!FaceLandmarker||!FilesetResolver)throw Error('MediaPipe не се зареди.');const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1};try{return await FaceLandmarker.createFromOptions(files,opts)}catch(e){opts.baseOptions.delegate='CPU';return await FaceLandmarker.createFromOptions(files,opts)}}
$('start').onclick=async()=>{$('start').disabled=true;try{status.textContent='Включване на камерата...';if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});v.srcObject=stream;await v.play()}if(!detector)detector=await loadAI();status.textContent='AI е активен · Режим Замяна'}catch(e){status.textContent='Грешка: '+(e.message||String(e))}finally{$('start').disabled=false}};
function resize(){const d=devicePixelRatio||1;cssW=stage.clientWidth;cssH=stage.clientHeight;const w=Math.round(cssW*d),h=Math.round(cssH*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}ctx.setTransform(d,0,0,d,0,0)}
const innerTop=[61,78,191,80,81,82,13,312,311,310,415,308,291],innerBottom=[291,324,318,402,317,14,87,178,88,95,78,61];
function mouthPath(p){ctx.beginPath();let q=p(innerTop[0]);ctx.moveTo(q.x,q.y);for(let i=1;i<innerTop.length;i++){q=p(innerTop[i]);ctx.lineTo(q.x,q.y)}for(let i=1;i<innerBottom.length;i++){q=p(innerBottom[i]);ctx.lineTo(q.x,q.y)}ctx.closePath()}
function toothPath(x,y,w,h,shape){const k=shape==='square'?.06:shape==='soft'?.28:shape==='taper'?.16:.19,r=w*k,neck=shape==='taper'?.76:shape==='square'?.92:.84;ctx.beginPath();ctx.moveTo(x+w*(1-neck)/2,y);ctx.bezierCurveTo(x,y+h*.2,x,y+h*.65,x,y+h-r);ctx.quadraticCurveTo(x,y+h,x+r,y+h);ctx.lineTo(x+w-r,y+h);ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-r);ctx.bezierCurveTo(x+w,y+h*.65,x+w,y+h*.2,x+w*(1+neck)/2,y);ctx.closePath()}
function render(p){const l=p(61),r=p(291),t=p(13),b=p(14);const width=Math.hypot(r.x-l.x,r.y-l.y),gap=Math.hypot(b.x-t.x,b.y-t.y);if(width<25||gap<width*.065)return;ctx.save();mouthPath(p);ctx.clip();
const bg=ctx.createRadialGradient((l.x+r.x)/2,(t.y+b.y)/2,width*.04,(l.x+r.x)/2,(t.y+b.y)/2,width*.7);bg.addColorStop(0,'#241018');bg.addColorStop(1,'#09060b');ctx.fillStyle=bg;ctx.fillRect(Math.min(l.x,r.x)-10,Math.min(t.y,b.y)-width,width+20,width*2);
const angle=Math.atan2(r.y-l.y,r.x-l.x),size=Number($('size').value)/100,design=$('design').value,shade=$('shade').value;ctx.translate((l.x+r.x)/2,t.y-gap*.30);ctx.rotate(angle);const span=width*.96*size*(design==='broad'?1.08:1);const units=[.54,.67,.82,1.02,1.17,1.17,1.02,.82,.67,.54],sum=units.reduce((a,b)=>a+b,0),u=span/sum;let x=-span/2;const base=shade==='bl'?'#fffefa':shade==='b1'?'#fff9ed':'#f2e8d5',edge=shade==='a1'?'#b9a88e':'#c7c4bc';for(let i=0;i<10;i++){const dist=Math.abs(i-4.5),w=units[i]*u,h=Math.min(width*.27,gap*1.55)*(dist<1?1:dist<2?.82:dist<3?.94:.72)*size,y=dist*dist*gap*.022-gap*.09;const g=ctx.createLinearGradient(x,y,x+w,y);g.addColorStop(0,edge);g.addColorStop(.20,base);g.addColorStop(.72,base);g.addColorStop(1,edge);toothPath(x+u*.025,y,w-u*.05,h,design);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(77,67,63,.42)';ctx.lineWidth=Math.max(.35,width*.003);ctx.stroke();x+=w}ctx.restore();if($('guide').checked){mouthPath(p);ctx.strokeStyle='#40ebc9';ctx.lineWidth=2;ctx.stroke()}}
function draw(){resize();ctx.clearRect(0,0,cssW,cssH);if(detector&&v.readyState>=2&&v.videoWidth){try{const now=performance.now();if(v.currentTime!==last&&now-lastDetect>65){last=v.currentTime;lastDetect=now;marks=detector.detectForVideo(v,now).faceLandmarks[0]||null}if(marks){const s=Math.max(cssW/v.videoWidth,cssH/v.videoHeight),ox=(cssW-v.videoWidth*s)/2,oy=(cssH-v.videoHeight*s)/2,p=id=>({x:marks[id].x*v.videoWidth*s+ox,y:marks[id].y*v.videoHeight*s+oy});render(p)}}catch(e){status.textContent='Tracking: '+e.message}}requestAnimationFrame(draw)}draw();
$('photo').onclick=()=>{if(!stream||!v.videoWidth)return;const out=document.createElement('canvas');out.width=c.width;out.height=c.height;const x=out.getContext('2d'),w=out.width,h=out.height,s=Math.max(w/v.videoWidth,h/v.videoHeight);x.save();x.translate(w,0);x.scale(-1,1);x.drawImage(v,(w-v.videoWidth*s)/2,(h-v.videoHeight*s)/2,v.videoWidth*s,v.videoHeight*s);x.drawImage(c,0,0,w,h);x.restore();out.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='twin-smile-v04.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)},'image/png')};
</script></body></html>
