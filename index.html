<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TWIN SMILE AI v0.3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:#fff;font:16px -apple-system,BlinkMacSystemFont,Arial}
.app{max-width:600px;margin:auto;padding:16px}
h2{margin:5px 0}
small,.status{color:#afbdd0}
.stage{position:relative;aspect-ratio:3/4;background:#202838;border-radius:22px;overflow:hidden;margin:18px 0}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
canvas{pointer-events:none}
.controls{display:grid;gap:15px}
.row{display:flex;gap:10px}
button,select{padding:14px;border:0;border-radius:12px;font:inherit}
button{background:#dceeff;color:#152238;font-weight:700;flex:1}
button:disabled{opacity:.6}
select{background:#29364d;color:white;width:100%}
label{display:grid;gap:8px}
input[type=range]{width:100%}
.status{font-size:13px;line-height:1.5;min-height:25px}
</style>
</head>
<body>
<div class="app">
<h2>TWIN SMILE <span style="color:#87d4ff">AI</span></h2>
<small>Live Smile Studio · v0.3</small>
<div class="stage" id="stage">
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
</div>
<div class="controls">
<div class="row">
<button id="start">Включи камерата</button>
<button id="photo">Снимка</button>
</div>
<label>Дизайн на усмивката
<select id="design">
<option value="oval">Natural Oval</option>
<option value="square">Hollywood Square</option>
<option value="soft">Soft Rounded</option>
<option value="taper">Elegant Tapered</option>
<option value="broad">Broad Smile</option>
</select></label>
<label>Цвят
<select id="shade">
<option value="a1">Natural A1</option>
<option value="b1">Bright B1</option>
<option value="bl">Bleach White</option>
</select></label>
<label>Размер
<input id="size" type="range" min="70" max="130" value="100">
</label>
<label><span><input type="checkbox" id="guide"> Контур на устата</span></label>
<div id="status" class="status">Готов за стартиране.</div>
</div></div>
<script type="module">
const $=id=>document.getElementById(id);
const v=$('video'),c=$('canvas'),ctx=c.getContext('2d'),stage=$('stage'),status=$('status');
let detector=null,stream=null,marks=null,last=-1,lastDetect=0;
let cssW=0,cssH=0;

async function loadAI(){
status.textContent='Зареждане на MediaPipe...';
const lib=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs');
const FaceLandmarker=lib.FaceLandmarker||lib.default?.FaceLandmarker;
const FilesetResolver=lib.FilesetResolver||lib.default?.FilesetResolver;
if(!FaceLandmarker||!FilesetResolver)throw Error('Неуспешно зареждане на MediaPipe.');
const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');
const opts={
baseOptions:{
modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
delegate:'GPU'
},
runningMode:'VIDEO',
numFaces:1
};
status.textContent='Зареждане на AI модела...';
try{return await FaceLandmarker.createFromOptions(files,opts)}
catch(e){
status.textContent='Опит с CPU...';
opts.baseOptions.delegate='CPU';
return await FaceLandmarker.createFromOptions(files,opts);
}
}

$('start').onclick=async()=>{
$('start').disabled=true;
try{
status.textContent='Включване на камерата...';
if(!stream){
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:'user'},audio:false
});
v.srcObject=stream;
await v.play();
}
if(!detector)detector=await loadAI();
status.textContent='AI е активен. Усмихни се!';
}catch(e){
status.textContent='Грешка: '+(e.message||String(e));
}finally{$('start').disabled=false}
};

function resize(){
const d=devicePixelRatio||1;
cssW=stage.clientWidth;
cssH=stage.clientHeight;
const cw=Math.round(cssW*d),ch=Math.round(cssH*d);
if(c.width!==cw||c.height!==ch){
c.width=cw;c.height=ch;
}
ctx.setTransform(d,0,0,d,0,0);
}

function mouthPath(p){
const top=[78,191,80,81,82,13,312,311,310,415,308];
const bottom=[324,318,402,317,14,87,178,88,95,78];
ctx.beginPath();
let q=p(top[0]);
ctx.moveTo(q.x,q.y);
for(let i=1;i<top.length;i++){
q=p(top[i]);ctx.lineTo(q.x,q.y);
}
for(const id of bottom){
q=p(id);ctx.lineTo(q.x,q.y);
}
ctx.closePath();
}

function toothPath(x,y,w,h,shape){
const corner=shape==='square'?.06:shape==='soft'?.29:shape==='taper'?.18:.20;
const r=w*corner;
const neck=shape==='taper'?.76:shape==='square'?.92:.84;
ctx.beginPath();
ctx.moveTo(x+w*(1-neck)/2,y);
ctx.bezierCurveTo(x-w*.03,y+h*.22,x-r*.10,y+h*.68,x,y+h-r);
ctx.quadraticCurveTo(x,y+h,x+r,y+h);
ctx.lineTo(x+w-r,y+h);
ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-r);
ctx.bezierCurveTo(x+w+r*.08,y+h*.60,x+w*.99,y+h*.20,x+w*(1+neck)/2,y);
ctx.closePath();
}

function renderTeeth(p){
const left=p(61),right=p(291),top=p(13),bottom=p(14);
const width=Math.hypot(right.x-left.x,right.y-left.y);
const gap=Math.hypot(bottom.x-top.x,bottom.y-top.y);
if(width<25||gap<width*.065)return;

const design=$('design').value;
const size=Number($('size').value)/100;
const broad=design==='broad'?1.10:1;
const angle=Math.atan2(right.y-left.y,right.x-left.x);
const shade=$('shade').value;
const base=shade==='bl'?'#ffffff':shade==='b1'?'#fffaf0':'#f3ead8';
const shadow=shade==='a1'?'#b6a68c':'#c6c4bc';

ctx.save();
mouthPath(p);
ctx.clip();

const centerX=(left.x+right.x)/2;
const y=top.y-gap*.15;
ctx.translate(centerX,y);
ctx.rotate(angle);

const span=width*.94*size*broad;
const units=[.60,.70,.84,1.02,1.14,1.14,1.02,.84,.70,.60];
const sum=units.reduce((a,b)=>a+b,0);
const unit=span/sum;
let x=-span/2;

for(let i=0;i<10;i++){
const distance=Math.abs(i-4.5);
const w=units[i]*unit;
const center=distance<1;
const lateral=distance>=1&&distance<2;
const canine=distance>=2&&distance<3;
const lengthFactor=center?1:lateral?.82:canine?.95:.73;
const h=Math.min(width*.26,gap*1.38)*lengthFactor*size;
const arch=distance*distance*gap*.018;
const yy=arch-gap*.16;

const gradient=ctx.createLinearGradient(x,yy,x+w,yy);
gradient.addColorStop(0,shadow);
gradient.addColorStop(.16,base);
gradient.addColorStop(.60,base);
gradient.addColorStop(1,shadow);

toothPath(x+unit*.025,yy,w-unit*.05,h,design);
ctx.fillStyle=gradient;
ctx.fill();
ctx.strokeStyle='rgba(92,79,70,.42)';
ctx.lineWidth=Math.max(.35,width*.004);
ctx.stroke();

ctx.save();
toothPath(x+unit*.025,yy,w-unit*.05,h,design);
ctx.clip();
const shine=ctx.createLinearGradient(x,yy,x+w,yy);
shine.addColorStop(0,'rgba(255,255,255,0)');
shine.addColorStop(.40,'rgba(255,255,255,.26)');
shine.addColorStop(.65,'rgba(255,255,255,.08)');
shine.addColorStop(1,'rgba(255,255,255,0)');
ctx.fillStyle=shine;
ctx.fillRect(x,yy,w,h);
ctx.restore();
x+=w;
}
ctx.restore();

if($('guide').checked){
ctx.save();
mouthPath(p);
ctx.strokeStyle='#40ebc9';
ctx.lineWidth=2;
ctx.stroke();
ctx.restore();
}
}

function draw(){
resize();
ctx.clearRect(0,0,cssW,cssH);
if(detector&&v.readyState>=2&&v.videoWidth){
try{
const now=performance.now();
if(v.currentTime!==last&&now-lastDetect>65){
last=v.currentTime;
lastDetect=now;
const result=detector.detectForVideo(v,now);
marks=result.faceLandmarks[0]||null;
}
if(marks){
const s=Math.max(cssW/v.videoWidth,cssH/v.videoHeight);
const ox=(cssW-v.videoWidth*s)/2;
const oy=(cssH-v.videoHeight*s)/2;
const p=id=>({
x:marks[id].x*v.videoWidth*s+ox,
y:marks[id].y*v.videoHeight*s+oy
});
renderTeeth(p);
}
}catch(e){status.textContent='Tracking: '+e.message}
}
requestAnimationFrame(draw);
}
draw();

$('photo').onclick=()=>{
if(!stream||!v.videoWidth)return;
const out=document.createElement('canvas');
out.width=c.width;
out.height=c.height;
const x=out.getContext('2d'),w=out.width,h=out.height;
const s=Math.max(w/v.videoWidth,h/v.videoHeight);
x.save();
x.translate(w,0);
x.scale(-1,1);
x.drawImage(v,(w-v.videoWidth*s)/2,(h-v.videoHeight*s)/2,v.videoWidth*s,v.videoHeight*s);
x.drawImage(c,0,0,w,h);
x.restore();
out.toBlob(blob=>{
if(!blob)return;
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='twin-smile-v03.png';
a.click();
setTimeout(()=>URL.revokeObjectURL(url),5000);
},'image/png');
};
</script>
</body>
</html>
