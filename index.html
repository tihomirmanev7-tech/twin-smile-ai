</style></head><body><div class="app"><h2>TWIN SMILE <span style="color:#87d4ff">AI</span></h2><small>Live Smile Studio Â· v0.6 Â· Natural Smile</small><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas></div><div class="controls"><div class="row"><button id="start">ÐÐºÐ»ÑÑÐ¸ ÐºÐ°Ð¼ÐµÑÐ°ÑÐ°</button><button id="photo">Ð¡Ð½Ð¸Ð¼ÐºÐ°</button></div><button id="auto">Auto Design: ÐÐÐ.</button><label>Ð¤Ð¾ÑÐ¼Ð°<select id="design"><option value="natural">Natural Â· Ð°Ð²ÑÐ¾Ð¼Ð°ÑÐ¸ÑÐ½Ð°</option><option value="oval">Soft Oval</option><option value="square">Soft Square</option><option value="taper">Gentle Taper</option></select></label><label>Ð ÐµÐ¶Ð¸Ð¼<select id="mode"><option value="replace">ÐÐ°Ð¼ÑÐ½Ð°</option><option value="compare">Ð¡ÑÐ°Ð²Ð½ÐµÐ½Ð¸Ðµ</option></select></label><label>ÐÑÐ¾Ð·ÑÐ°ÑÐ½Ð¾ÑÑ Ð½Ð° Ð²Ð¸ÑÑÑÐ°Ð»Ð½Ð¸ÑÐµ Ð·ÑÐ±Ð¸: <span id="alphaValue">100%</span><input id="alpha" type="range" min="0" max="100" value="100"></label><label>Ð¦Ð²ÑÑ<select id="shade"><option value="a1">Natural A1</option><option value="b1">Bright B1</option><option value="bl">Bleach</option></select></label><label>3D ÑÐµÐ»ÐµÑ<input id="relief" type="range" min="20" max="100" value="65"></label><label>Ð Ð°Ð·Ð¼ÐµÑ<input id="size" type="range" min="75" max="125" value="100"></label><label><span><input type="checkbox" id="guide"> ÐÐ¾Ð½ÑÑÑ Ð½Ð° ÑÑÑÐ°ÑÐ°</span></label><div id="status" class="status">ÐÐ¾ÑÐ¾Ð² Ð·Ð° ÑÑÐ°ÑÑÐ¸ÑÐ°Ð½Ðµ.</div></div></div>
<script type="module">
const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d'),stage=$('stage'),status=$('status');
let detector=null,stream=null,marks=null,last=-1,lastDetect=0,W=0,H=0,auto=true,faceType='oval';
let THREE,renderer,scene,camera,teethGroup,meshList=[];
$('auto').onclick=()=>{auto=!auto;$('auto').textContent='Auto Design: '+(auto?'ÐÐÐ.':'ÐÐÐÐ.')};

async function loadAI(){status.textContent='ÐÐ°ÑÐµÐ¶Ð´Ð°Ð½Ðµ Ð½Ð° MediaPipe...';const lib=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs');const FaceLandmarker=lib.FaceLandmarker||lib.default?.FaceLandmarker,FilesetResolver=lib.FilesetResolver||lib.default?.FilesetResolver;if(!FaceLandmarker||!FilesetResolver)throw Error('MediaPipe Ð½Ðµ ÑÐµ Ð·Ð°ÑÐµÐ´Ð¸');const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1};try{return await FaceLandmarker.createFromOptions(files,opts)}catch(e){status.textContent='ÐÐ¿Ð¸Ñ Ñ CPU...';opts.baseOptions.delegate='CPU';return await FaceLandmarker.createFromOptions(files,opts)}}
$('start').onclick=async()=>{$('start').disabled=true;try{status.textContent='ÐÐºÐ»ÑÑÐ²Ð°Ð½Ðµ Ð½Ð° ÐºÐ°Ð¼ÐµÑÐ°ÑÐ°...';if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});v.srcObject=stream;await v.play()}if(!detector)detector=await loadAI();if(!renderer)await load3D();status.textContent='AI + 3D Ð°ÐºÑÐ¸Ð²Ð½Ð¸ Â· Natural Smile'}catch(e){status.textContent='ÐÑÐµÑÐºÐ°: '+(e.message||String(e))}finally{$('start').disabled=false}};
function resize(){const d=devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;const cw=Math.round(W*d),ch=Math.round(H*d);if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch}ctx.setTransform(d,0,0,d,0,0)}
const upper=[61,78,191,80,81,82,13,312,311,310,415,308,291],lower=[291,324,318,402,317,14,87,178,88,95,78,61];
function mouthPath(p){ctx.beginPath();let q=p(upper[0]);ctx.moveTo(q.x,q.y);for(let i=1;i<upper.length;i++){q=p(upper[i]);ctx.lineTo(q.x,q.y)}for(let i=1;i<lower.length;i++){q=p(lower[i]);ctx.lineTo(q.x,q.y)}ctx.closePath()}
function faceShape(p){const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const jaw=d(p(172),p(397)),cheeks=d(p(234),p(454)),height=d(p(10),p(152));const ratio=height/Math.max(cheeks,1),jawRatio=jaw/Math.max(cheeks,1);if(ratio>1.55)return 'taper';if(jawRatio>.83)return 'square';return 'oval'}
async function load3D(){
 status.textContent='ÐÐ°ÑÐµÐ¶Ð´Ð°Ð½Ðµ Ð½Ð° 3D...';
 THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
 renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:false});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;
 scene=new THREE.Scene();camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,2000);camera.position.z=600;
 scene.add(new THREE.HemisphereLight(0xffffff,0x756b65,2.1));
 const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(-100,140,350);scene.add(light);
 const side=new THREE.DirectionalLight(0xd5e3ff,.75);side.position.set(180,-30,150);scene.add(side);
 teethGroup=new THREE.Group();scene.add(teethGroup);
}
function toothGeometry(w,h,type,shape,relief){
 const vertices=[],indices=[],colors=[];const rows=15,cols=16;
 const taper=shape==='taper'?.16:shape==='square'?.04:.09;
 const baseColor=new THREE.Color($('shade').value==='bl'?'#fffaf1':$('shade').value==='b1'?'#f6eedc':'#e9d8bc');
 for(let j=0;j<=rows;j++){
  const t=j/rows;let left=taper*(1-t)*w, right=w-left;
  for(let i=0;i<=cols;i++){
   const u=i/cols;let xx=left+(right-left)*u-w/2;
   const tip=type==='canine' ? (1-Math.abs(u-.5)*2)*h*.115 : type==='lateral' ? h*.025*Math.sin(Math.PI*u):0;
   const yy=h*.5-t*h+tip*t;
   const dome=Math.pow(Math.max(0,Math.sin(Math.PI*u)),.65)*Math.sin(Math.PI*(.12+.88*t));
   const z=relief*(3.2+6.5*dome)+Math.sin(u*12.5)*.25;
   vertices.push(xx,yy,z);
   const enamel=baseColor.clone();const brightness= .83+.16*Math.sin(Math.PI*u)+.04*(1-t);
   enamel.multiplyScalar(brightness);if(t>.84)enamel.lerp(new THREE.Color('#b5c0c8'),.08*(t-.84)/.16);
   colors.push(enamel.r,enamel.g,enamel.b);
  }
 }
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=j*(cols+1)+i,b=a+cols+1;indices.push(a,b,a+1,b,b+1,a+1)}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.setIndex(indices);geo.computeVertexNormals();return geo;
}
function updateTeeth(width,gap,shape){
 if(!teethGroup)return;
 while(teethGroup.children.length){const m=teethGroup.children[0];teethGroup.remove(m);m.geometry.dispose();m.material.dispose()}
 const size=Number($('size').value)/100,span=width*.91*size;
 const units=[.52,.62,.77,.91,1.13,1.13,.91,.77,.62,.52],sum=units.reduce((a,b)=>a+b,0),u=span/sum;
 let x=-span/2;const relief=Number($('relief').value)/100;
 for(let i=0;i<10;i++){
  const dist=Math.abs(i-4.5),w=units[i]*u,central=dist<1,lateral=dist>=1&&dist<2,canine=dist>=2&&dist<3;
  const h=Math.min(width*.29,gap*1.70)*(central?1:lateral?.84:canine?.93:.73)*size;
  const arch=dist*dist*gap*.026,yy=arch-gap*.10;
  const geo=toothGeometry(w-u*.045,h,canine?'canine':lateral?'lateral':'incisor',shape,relief);
  const mat=new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:.28,metalness:0,clearcoat:.32,clearcoatRoughness:.21,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(x+w/2,-yy-h/2,-dist*2.8);
  mesh.rotation.y=(i-4.5)*-.085;mesh.rotation.z=(i-4.5)*-.015;
  teethGroup.add(mesh);x+=w;
 }
}
let lastGeometry='';
function render(p){
 const l=p(61),r=p(291),t=p(13),b=p(14),width=Math.hypot(r.x-l.x,r.y-l.y),gap=Math.hypot(b.x-t.x,b.y-t.y);
 if(width<25||gap<width*.07||!renderer)return;
 const alpha=Number($('alpha').value)/100;if(alpha<=0)return;
 const mode=$('mode').value,shape=auto?faceType:($('design').value==='natural'?'oval':$('design').value);
 const key=[Math.round(width/2),Math.round(gap/2),shape,$('size').value,$('shade').value,$('relief').value].join('|');
 if(key!==lastGeometry){updateTeeth(width,gap,shape);lastGeometry=key}
 const angle=Math.atan2(r.y-l.y,r.x-l.x);
 teethGroup.position.set((l.x+r.x)/2-W/2,H/2-(t.y-gap*.28),0);teethGroup.rotation.z=-angle;
 const d=Math.min(devicePixelRatio||1,2);renderer.setSize(W,H,false);
 camera.left=-W/2;camera.right=W/2;camera.top=H/2;camera.bottom=-H/2;camera.updateProjectionMatrix();renderer.render(scene,camera);
 ctx.save();mouthPath(p);ctx.clip();ctx.globalAlpha=alpha;
 if(mode==='replace'){
  const bg=ctx.createRadialGradient((l.x+r.x)/2,(t.y+b.y)/2,width*.05,(l.x+r.x)/2,(t.y+b.y)/2,width*.72);
  bg.addColorStop(0,'#2b111a');bg.addColorStop(1,'#10070e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H)
 }

 if($('guide').checked){ctx.save();mouthPath(p);ctx.strokeStyle='#40ebc9';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
}
function draw(){resize();ctx.clearRect(0,0,W,H);if(detector&&v.readyState>=2&&v.videoWidth){try{const now=performance.now();if(v.currentTime!==last&&now-lastDetect>65){last=v.currentTime;lastDetect=now;marks=detector.detectForVideo(v,now).faceLandmarks[0]||null}if(marks){const s=Math.max(W/v.videoWidth,H/v.videoHeight),ox=(W-v.videoWidth*s)/2,oy=(H-v.videoHeight*s)/2,p=id=>({x:marks[id].x*v.videoWidth*s+ox,y:marks[id].y*v.videoHeight*s+oy});faceType=faceShape(p);render(p)}}catch(e){status.textContent='Tracking: '+e.message}}requestAnimationFrame(draw)}draw();
$('photo').onclick=()=>{if(!stream||!v.videoWidth)return;const out=document.createElement('canvas');out.width=c.width;out.height=c.height;const x=out.getContext('2d'),w=out.width,h=out.height,s=Math.max(w/v.videoWidth,h/v.videoHeight);x.save();x.translate(w,0);x.scale(-1,1);x.drawImage(v,(w-v.videoWidth*s)/2,(h-v.videoHeight*s)/2,v.videoWidth*s,v.videoHeight*s);x.drawImage(c,0,0,w,h);x.restore();out.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='twin-smile-v06.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)},'image/png')};
